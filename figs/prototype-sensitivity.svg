<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-label="Prototype-count sensitivity"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#374151}.title{font-size:16px;font-weight:700;fill:#111827}.sub{font-size:11px;fill:#6b7280}.axis{stroke:#cbd5e1;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.line1{stroke:#1565d8;stroke-width:2.5;fill:none}.line2{stroke:#8b5cf6;stroke-width:2.5;fill:none}.pt1{fill:#1565d8}.pt2{fill:#8b5cf6}.lab{font-size:10px}.legend{font-size:10px}</style><rect width="100%" height="100%" fill="white" rx="10"/><text class="title" x="18" y="33">Structural fidelity (Spearman)</text><line class="grid" x1="52" y1="49.0" x2="423" y2="49.0"/><text class="lab" text-anchor="end" x="47" y="52.0">0.25</text><line class="grid" x1="52" y1="111.3" x2="423" y2="111.3"/><text class="lab" text-anchor="end" x="47" y="114.3">0.20</text><line class="grid" x1="52" y1="173.7" x2="423" y2="173.7"/><text class="lab" text-anchor="end" x="47" y="176.7">0.15</text><line class="grid" x1="52" y1="236.0" x2="423" y2="236.0"/><text class="lab" text-anchor="end" x="47" y="239.0">0.10</text><circle class="pt1" cx="52.0" cy="67.5" r="3"/><text class="lab" text-anchor="middle" x="52.0" y="253">1.25k</text><circle class="pt1" cx="144.8" cy="67.3" r="3"/><text class="lab" text-anchor="middle" x="144.8" y="253">2.5k</text><circle class="pt1" cx="237.5" cy="113.7" r="3"/><text class="lab" text-anchor="middle" x="237.5" y="253">5k</text><circle class="pt1" cx="330.2" cy="155.0" r="3"/><text class="lab" text-anchor="middle" x="330.2" y="253">7.5k</text><circle class="pt1" cx="423.0" cy="197.6" r="3"/><text class="lab" text-anchor="middle" x="423.0" y="253">10k</text><polyline class="line1" points="52.0,67.5 144.8,67.3 237.5,113.7 330.2,155.0 423.0,197.6"/><line class="axis" x1="52" y1="236" x2="423" y2="236"/><line class="axis" x1="52" y1="49" x2="52" y2="236"/><text class="title" x="473" y="33">Lexical diversity (Distinct-2)</text><line class="grid" x1="507" y1="49.0" x2="878" y2="49.0"/><text class="lab" text-anchor="end" x="502" y="52.0">0.49</text><line class="grid" x1="507" y1="111.3" x2="878" y2="111.3"/><text class="lab" text-anchor="end" x="502" y="114.3">0.46</text><line class="grid" x1="507" y1="173.7" x2="878" y2="173.7"/><text class="lab" text-anchor="end" x="502" y="176.7">0.43</text><line class="grid" x1="507" y1="236.0" x2="878" y2="236.0"/><text class="lab" text-anchor="end" x="502" y="239.0">0.40</text><circle class="pt2" cx="507.0" cy="89.5" r="3"/><text class="lab" text-anchor="middle" x="507.0" y="253">1.25k</text><circle class="pt2" cx="599.8" cy="181.8" r="3"/><text class="lab" text-anchor="middle" x="599.8" y="253">2.5k</text><circle class="pt2" cx="692.5" cy="182.6" r="3"/><text class="lab" text-anchor="middle" x="692.5" y="253">5k</text><circle class="pt2" cx="785.2" cy="166.8" r="3"/><text class="lab" text-anchor="middle" x="785.2" y="253">7.5k</text><circle class="pt2" cx="878.0" cy="116.3" r="3"/><text class="lab" text-anchor="middle" x="878.0" y="253">10k</text><polyline class="line2" points="507.0,89.5 599.8,181.8 692.5,182.6 785.2,166.8 878.0,116.3"/><line class="axis" x1="507" y1="236" x2="878" y2="236"/><line class="axis" x1="507" y1="49" x2="507" y2="236"/><text class="sub" x="450" y="298" text-anchor="middle">A compact prototype set is sufficient; expanding too far weakens the structural backbone learned by the anchors.</text></svg>